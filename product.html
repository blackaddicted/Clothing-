<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — MAISON NOIR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="nav-scrim"></div>

<header class="site-header">
  <div class="announce-bar">Complimentary shipping on orders over ₹5,000 — Use code MAISON at checkout</div>
  <div class="header-top">
    <a href="index.html" class="logo">MAISON<span>·</span>NOIR</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html?category=Women">Women</a>
      <a href="shop.html?category=Men">Men</a>
      <a href="shop.html?category=New">New Arrivals</a>
      <a href="shop.html?category=Premium">Premium</a>
      <a href="track.html">Track Order</a>
    </nav>
    <div class="header-actions">
      <a href="shop.html" class="icon-btn" aria-label="Search / Shop"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
      <a href="admin.html" class="icon-btn" aria-label="Account"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      <a href="cart.html" class="icon-btn" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="cart-badge" data-cart-count>0</span></a>
      <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="page-banner" style="text-align:left; padding-top:22px; padding-bottom:22px;">
  <div class="breadcrumb"><a href="index.html">Home</a> / <a href="shop.html" id="crumb-shop">Shop</a> / <span id="crumb-product">Product</span></div>
</div>

<section class="section" style="padding-top:20px;">
  <div class="container">
    <div class="product-detail" id="productDetail"></div>

    <div style="margin-top:100px;">
      <div class="section-head" data-reveal>
        <div><span class="eyebrow">You May Also Like</span><h2 class="section-title">Related pieces</h2></div>
      </div>
      <div class="product-grid" id="relatedGrid"></div>
    </div>
  </div>
</section>

<footer class="site-footer" style="margin-top:40px;">
  <div class="container footer-bottom" style="border-top:1px solid rgba(217,192,139,0.18); padding-top:20px;">
    <span>&copy; <span data-year></span> Maison Noir. All rights reserved.</span>
    <div class="payment-icons"><span>UPI</span><span>Visa</span><span>Mastercard</span><span>RuPay</span></div>
    <a href="admin.html">Admin</a>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || PRODUCTS[0].id;
  const product = getAllProductsLive().find(p => p.id === id) || getProductById(id) || PRODUCTS[0];
  let selectedSize = null;
  let qty = 1;

  document.title = product.name + " — MAISON NOIR";
  document.getElementById('crumb-shop').textContent = product.category;
  document.getElementById('crumb-shop').href = 'shop.html?category=' + product.category;
  document.getElementById('crumb-product').textContent = product.name;

  function renderDetail() {
    const el = document.getElementById('productDetail');
    el.innerHTML = `
      <div>
        <div class="gallery-main"><img id="galleryMain" src="${product.images[0]}" alt="${product.name}"></div>
        <div class="gallery-thumbs">
          ${product.images.map((img, i) => `<button class="${i === 0 ? 'is-active' : ''}" data-idx="${i}"><img src="${img}" alt="View ${i + 1}"></button>`).join('')}
        </div>
      </div>
      <div>
        <p class="pd-cat">${product.category} ${product.bestseller ? '· Bestseller' : ''}</p>
        <h1 class="pd-title">${product.name}</h1>
        <p class="pd-price">${formatPrice(product.price)}</p>
        <p class="pd-desc">${product.description}</p>

        <div class="pd-block">
          <h4>Size <a href="#" class="size-guide-link" onclick="return false;">Size Guide</a></h4>
          <div class="size-pills" id="pdSizes">
            ${product.sizes.map(s => `<button class="size-pill" data-size="${s}">${s}</button>`).join('')}
          </div>
        </div>

        <div class="pd-block">
          <h4>Quantity</h4>
          <div class="qty-selector">
            <button id="qtyMinus" aria-label="Decrease quantity">–</button>
            <span id="qtyVal">1</span>
            <button id="qtyPlus" aria-label="Increase quantity">+</button>
          </div>
        </div>

        <p class="stock-note">✓ In stock — ships within 2–3 business days</p>
        <div class="pd-actions">
          <button class="btn btn-outline btn-block" id="addToCartBtn">Add to Cart</button>
          <button class="btn btn-primary btn-block" id="buyNowBtn">Buy Now</button>
        </div>
        <p class="field-error" id="sizeError" style="display:none;">Please select a size before continuing.</p>

        <div class="pd-meta-row">
          <span>Free shipping over ₹5,000</span>
          <span>·</span>
          <span>Easy 14-day returns</span>
        </div>

        <div style="margin-top:30px;">
          <div class="accordion-item">
            <button class="accordion-btn">Fabric &amp; Care <span class="plus">+</span></button>
            <div class="accordion-panel"><div class="accordion-panel-inner">${product.fabric}</div></div>
          </div>
          <div class="accordion-item">
            <button class="accordion-btn">Shipping &amp; Returns <span class="plus">+</span></button>
            <div class="accordion-panel"><div class="accordion-panel-inner">Orders ship within 2–3 business days. Free shipping on orders over ₹5,000, flat ₹150 otherwise. Unworn items may be returned within 14 days of delivery for a full refund.</div></div>
          </div>
          <div class="accordion-item">
            <button class="accordion-btn">Delivery Estimate <span class="plus">+</span></button>
            <div class="accordion-panel"><div class="accordion-panel-inner">Metro cities: 2–4 business days. Rest of India: 4–7 business days.</div></div>
          </div>
        </div>
      </div>
    `;

    // gallery thumbs
    document.querySelectorAll('.gallery-thumbs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('galleryMain').src = product.images[btn.dataset.idx];
        document.querySelectorAll('.gallery-thumbs button').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
      });
    });

    // size select
    document.querySelectorAll('#pdSizes .size-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#pdSizes .size-pill').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        selectedSize = btn.dataset.size;
        document.getElementById('sizeError').style.display = 'none';
      });
    });

    // qty
    document.getElementById('qtyMinus').addEventListener('click', () => { qty = Math.max(1, qty - 1); document.getElementById('qtyVal').textContent = qty; });
    document.getElementById('qtyPlus').addEventListener('click', () => { qty = qty + 1; document.getElementById('qtyVal').textContent = qty; });

    // accordion
    document.querySelectorAll('.accordion-item').forEach(item => {
      const btn = item.querySelector('.accordion-btn');
      const panel = item.querySelector('.accordion-panel');
      btn.addEventListener('click', () => {
        const isOpen = item.classList.contains('is-open');
        document.querySelectorAll('.accordion-item').forEach(i => { i.classList.remove('is-open'); i.querySelector('.accordion-panel').style.maxHeight = null; });
        if (!isOpen) { item.classList.add('is-open'); panel.style.maxHeight = panel.scrollHeight + 'px'; }
      });
    });

    document.getElementById('addToCartBtn').addEventListener('click', () => {
      if (!selectedSize) { document.getElementById('sizeError').style.display = 'block'; return; }
      addToCart(product.id, selectedSize, qty);
      showToast(product.name + ' added to cart');
    });

    document.getElementById('buyNowBtn').addEventListener('click', () => {
      if (!selectedSize) { document.getElementById('sizeError').style.display = 'block'; return; }
      addToCart(product.id, selectedSize, qty);
      location.href = 'checkout.html';
    });
  }

  function productCard(p) {
    const alt = p.images[1] || p.images[0];
    return `
    <div class="product-card">
      <a href="product.html?id=${p.id}">
        <div class="product-media">
          <span class="look-tag">Look ${p.look}</span>
          <div class="product-badges">${p.tags.includes('new') ? '<span class="badge">New</span>' : ''}${p.bestseller ? '<span class="badge badge-gold">Bestseller</span>' : ''}</div>
          <img class="img-main" src="${p.images[0]}" alt="${p.name}" loading="lazy">
          <img class="img-alt" src="${alt}" alt="" loading="lazy">
        </div>
      </a>
      <button class="quick-add" onclick="addToCart('${p.id}','${p.sizes[0]}',1); showToast('${p.name.replace(/'/g,"")} added to cart');">Quick Add</button>
      <div class="product-info"><div><h3><a href="product.html?id=${p.id}">${p.name}</a></h3><span class="cat">${p.category}</span></div><span class="product-price">${formatPrice(p.price)}</span></div>
    </div>`;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('is-visible');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('is-visible'), 2200);
  }

  renderDetail();
  document.getElementById('relatedGrid').innerHTML = getRelatedProducts(product).map(productCard).join('');
</script>
</body>
</html>
