<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — MAISON NOIR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="nav-scrim"></div>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="logo">MAISON<span>·</span>NOIR</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html">Cart</a>
      <a href="track.html">Track Order</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="icon-btn" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="cart-badge" data-cart-count>0</span></a>
      <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="page-banner">
  <div class="breadcrumb"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / Checkout</div>
  <h1>Checkout</h1>
</div>

<section class="section" style="padding-top:44px;">
  <div class="container">
    <div id="checkoutWrap"></div>
  </div>
</section>

<footer class="site-footer" style="margin-top:20px;">
  <div class="container footer-bottom" style="border-top:1px solid rgba(217,192,139,0.18); padding-top:20px;">
    <span>&copy; <span data-year></span> Maison Noir. All rights reserved.</span>
    <div class="payment-icons"><span>UPI</span><span>Visa</span><span>Mastercard</span><span>RuPay</span></div>
    <a href="admin.html">Admin</a>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  const cart = getCart();
  const wrap = document.getElementById('checkoutWrap');

  if (!cart.length) {
    wrap.innerHTML = `
      <div class="empty-cart">
        <h2 style="font-size:1.6rem; margin-bottom:12px;">Your cart is empty</h2>
        <p style="color:var(--taupe); margin-bottom:26px;">Add something beautiful before checking out.</p>
        <a href="shop.html" class="btn btn-primary">Shop Now</a>
      </div>`;
  } else {
    const subtotal = cartTotal();
    const shipCost = subtotal >= 5000 ? 0 : 150;
    const total = subtotal + shipCost;

    const miniItems = cart.map(item => {
      const p = getProductById(item.id);
      if (!p) return '';
      return `<div class="mini-cart-item"><img src="${p.images[0]}" alt="${p.name}"><div><div>${p.name}</div><div class="qty-tag">Size ${item.size} · Qty ${item.qty}</div></div><div style="margin-left:auto; white-space:nowrap;">${formatPrice(p.price * item.qty)}</div></div>`;
    }).join('');

    wrap.innerHTML = `
      <form class="checkout-layout" id="checkoutForm" novalidate>
        <div>
          <div class="checkout-section">
            <h3>Contact &amp; Shipping Details</h3>
            <div class="field">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" required>
              <p class="field-error">Please enter your full name.</p>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
                <p class="field-error">Enter a valid 10-digit phone number.</p>
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <p class="field-error">Enter a valid email address.</p>
              </div>
            </div>
            <div class="field">
              <label for="address">Address</label>
              <textarea id="address" name="address" rows="3" required></textarea>
              <p class="field-error">Please enter your shipping address.</p>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
                <p class="field-error">Please enter your city.</p>
              </div>
              <div class="field">
                <label for="pincode">Pincode</label>
                <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" placeholder="6-digit pincode" required>
                <p class="field-error">Enter a valid 6-digit pincode.</p>
              </div>
            </div>
          </div>

          <div class="checkout-section">
            <h3>Payment Method</h3>
            <div class="payment-options" id="paymentOptions">
              <label class="payment-option is-selected">
                <input type="radio" name="payment" value="UPI" checked>
                <div style="flex:1;">
                  <strong>UPI</strong>
                  <div class="payment-detail" style="display:block;">
                    <div class="field" style="margin-top:12px; margin-bottom:0;">
                      <label for="upiId">UPI ID</label>
                      <input type="text" id="upiId" placeholder="yourname@upi">
                    </div>
                  </div>
                </div>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="Card">
                <div style="flex:1;">
                  <strong>Credit / Debit Card</strong>
                  <div class="payment-detail">
                    <div class="field-row" style="margin-top:12px;">
                      <div class="field" style="grid-column:1/-1; margin-bottom:10px;"><input type="text" placeholder="Card Number"></div>
                      <div class="field" style="margin-bottom:0;"><input type="text" placeholder="MM/YY"></div>
                      <div class="field" style="margin-bottom:0;"><input type="text" placeholder="CVV"></div>
                    </div>
                  </div>
                </div>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="COD">
                <div style="flex:1;"><strong>Cash on Delivery</strong></div>
              </label>
            </div>
          </div>
        </div>

        <div>
          <div class="summary-card">
            <h3>Order Summary</h3>
            <div class="mini-cart-list">${miniItems}</div>
            <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${shipCost === 0 ? 'Free' : formatPrice(shipCost)}</span></div>
            <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:22px;">Place Order</button>
            <a href="cart.html" class="btn-ghost" style="display:block; text-align:center; margin-top:16px;">Back to Cart</a>
          </div>
        </div>
      </form>`;

    // payment option UI toggle
    document.querySelectorAll('.payment-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('is-selected'));
        opt.classList.add('is-selected');
      });
    });

    const form = document.getElementById('checkoutForm');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let valid = true;
      form.querySelectorAll('[required]').forEach(input => {
        const field = input.closest('.field');
        const ok = input.checkValidity();
        if (field) field.classList.toggle('has-error', !ok);
        if (!ok) valid = false;
      });
      if (!valid) {
        form.querySelector('.has-error input, .has-error textarea')?.focus();
        return;
      }

      const payment = form.querySelector('input[name="payment"]:checked').value;
      const customer = {
        name: form.fullName.value,
        phone: form.phone.value,
        email: form.email.value,
        address: form.address.value,
        city: form.city.value,
        pincode: form.pincode.value
      };

      const items = cart.map(item => {
        const p = getProductById(item.id);
        return { id: item.id, name: p ? p.name : item.id, size: item.size, qty: item.qty, price: p ? p.price : 0 };
      });

      const order = createOrder(customer, items, total, payment);
      clearCart();
      location.href = `track.html?order=${order.id}&placed=1`;
    });
  }
</script>
</body>
</html>
